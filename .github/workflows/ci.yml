name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Parallel pipeline: the 4 gates fan out. build-core is the choke point
# (typecheck + audit both need core/dist); api runs fully in parallel.
jobs:
  build-core:
    name: build-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build @numberverse/core
        run: pnpm --filter @numberverse/core build
      - uses: actions/upload-artifact@v4
        with:
          name: core-dist
          path: packages/core/dist
          if-no-files-found: error

  typecheck-kid:
    name: typecheck-kid
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: core-dist
          path: packages/core/dist
      - name: Typecheck kid app
        run: pnpm --filter kid typecheck

  audit:
    name: audit
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: core-dist
          path: packages/core/dist
      - name: Catalog + i18n audit (skills ⇄ games ⇄ scenes ⇄ App)
        working-directory: apps/kid
        run: node scripts/audit.mjs
      - name: Locale-pack architecture test (#131)
        run: node scripts/test-locale.mjs
      - name: Share PNG has zero metadata (#93)
        run: node scripts/test-png-metadata.mjs

  api:
    name: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: API app compiles
        run: python3 -m compileall -q apps/api/app
      - name: API unit tests (PII scrubber)
        run: python3 apps/api/tests/test_scrub.py
      - name: API unit tests (structured error log #124)
        run: python3 apps/api/tests/test_errorlog.py
      - name: API unit tests (age-band lock matrix #275)
        run: python3 apps/api/tests/test_band_lock.py
      - name: API unit tests (parent data export format #273)
        run: python3 apps/api/tests/test_export.py
      - name: API unit tests (session revocation #265)
        run: python3 apps/api/tests/test_session_guard.py

  license-audit:
    name: license-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency license gate (#271)
        run: node scripts/license-audit.mjs

  dep-audit:
    name: dep-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency vulnerability gate (#308)
        run: node scripts/audit-deps.mjs

  bundle-size:
    name: bundle-size
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: core-dist
          path: packages/core/dist
      - name: Build kid app
        run: pnpm --filter kid build
      - name: Bundle-size regression gate (#305)
        run: node scripts/bundle-size.mjs

  content-safety:
    name: content-safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Child-safety content gate (#91)
        run: node scripts/content-safety.mjs

  tracker-scan:
    name: tracker-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: No-ads tracker gate (#92)
        run: node scripts/tracker-scan.mjs

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Secrets hygiene gate (#126)
        run: node scripts/secret-scan.mjs

  offline-e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers (chromium + firefox + webkit)
        run: pnpm exec playwright install --with-deps
      - name: Numberverse e2e (#264 offline, #925 sync drain, #926 cross-app, #927 portal)
        run: pnpm exec playwright test

  oracle:
    name: oracle
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: core-dist
          path: packages/core/dist
      - name: Oracle standup gate (#120)
        run: python3 scripts/team/oracle_team.py --ci --no-page --silent
