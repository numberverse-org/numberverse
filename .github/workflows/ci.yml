name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Parallel pipeline: the 4 gates fan out. build-core is the choke point
# (typecheck + audit both need core/dist); api runs fully in parallel.
jobs:
  build-core:
    name: build-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # #891 — cache the pnpm content-addressable store keyed on the lockfile
      # hash (prefix fallback restores the previous store on a bump, so only
      # changed packages re-download) instead of letting a lockfile change
      # invalidate the whole install in lockstep.
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Build @numberverse/core
        run: pnpm --filter @numberverse/core build
      - name: Core unit tests (Moni adaptive #953-#960)
        run: node packages/core/tests/moni_adaptive.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: core-dist
          path: packages/core/dist
          if-no-files-found: error

  typecheck-kid:
    name: typecheck-kid
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # #891 — cache the pnpm content-addressable store keyed on the lockfile
      # hash (prefix fallback restores the previous store on a bump, so only
      # changed packages re-download) instead of letting a lockfile change
      # invalidate the whole install in lockstep.
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: core-dist
          path: packages/core/dist
      - name: Typecheck kid app
        run: pnpm --filter kid typecheck

  audit:
    name: audit
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # #891 — cache the pnpm content-addressable store keyed on the lockfile
      # hash (prefix fallback restores the previous store on a bump, so only
      # changed packages re-download) instead of letting a lockfile change
      # invalidate the whole install in lockstep.
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: core-dist
          path: packages/core/dist
      - name: Catalog + i18n audit (skills ⇄ games ⇄ scenes ⇄ App)
        working-directory: apps/kid
        run: node scripts/audit.mjs
      - name: Locale-pack architecture test (#131)
        run: node scripts/test-locale.mjs
      - name: Share PNG has zero metadata (#93)
        run: node scripts/test-png-metadata.mjs
      - name: 3D island asset + mount gate (#888)
        run: node scripts/test-nova3d.mjs

  api:
    name: api (3.12 / 3.13)
    runs-on: ubuntu-latest
    # #1702 — supported-interpreter matrix: the requires-python bound is
    # ">=3.12,<3.14", so every API test runs on both supported interpreters to
    # catch interpreter regressions before merge.
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv (pinned for lockfile-toolchain reproducibility)
        run: python3 -m pip install --quiet "uv==0.11.3"
      - name: Lockfile drift guard (#1692)
        working-directory: apps/api
        run: uv lock --check
      - name: Sync API deps from lockfile (uv sync --frozen --no-dev, #1692/#1693)
        working-directory: apps/api
        run: uv sync --frozen --no-dev
      - name: Put synced venv on PATH for the unit tests
        run: echo "apps/api/.venv/bin" >> "$GITHUB_PATH"
      - name: API app compiles
        run: python3 -m compileall -q apps/api/app
      # #892 — Discovery loop: every apps/api/tests/test_*.py is a STANDALONE
      # subprocess script (not pytest), so instead of hand-listing each module
      # here (a new test_*.py used to run uncounted) we glob them all and run
      # each on the synced venv python already on PATH. Any non-zero exit aborts
      # the loop (`|| exit 1`), failing the whole job.
      # Modules (documentation): accesslog adaptive_model admin auth_hardening
      # auth band_lock bkash config_guard embedding_metadata errorlog export
      # health_probe import ip_ratelimit_tags jwt_rotation kids migrations_ddl
      # moni_subject_deltas org_isolation premium_gate progress_sync progress
      # push ratelimit_keys read_tier_ratelimit refresh_rotation request_id
      # retention schemas_validation scrub session_guard shares_token_hash
      # telemetry
      - name: API unit tests (discovery loop over test_*.py)
        run: |
          for t in apps/api/tests/test_*.py; do
            echo "== $t =="
            python3 "$t" || exit 1
          done

  # #890 — Consolidate the pure node gate scripts (no built core-dist, no
  # Python) into ONE job with a SINGLE `pnpm install` + shared pnpm store
  # cache. Jobs that genuinely need the core-dist artifact (typecheck-kid,
  # audit, bundle-size, offline-e2e) or Python (api, python-audit, oracle)
  # stay separate parallel jobs.
  node-gates:
    name: node-gates (license·dep·secret·content·tracker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # #891 — one pnpm store cache for the whole consolidated job (same shape
      # as the cache step on the other pnpm jobs): lockfile-keyed primary,
      # prefix-restore fallback so a bump only re-downloads the changed delta.
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Dependency vulnerability gate (#308)
        run: node scripts/audit-deps.mjs
      - name: Core-react major-skew check (#1697)
        run: |
          # react-is must resolve to a single major across the tree (the admin
          # app once resolved 16.13.1 + 19.2.8 transitively). A pnpm override
          # pins it to 19.x; this guard fails if a future change reintroduces
          # a second major of a core react package.
          MAJORS=$(grep -oE 'react-is@[0-9]+\.' pnpm-lock.yaml | sort -u | wc -l | tr -d ' ')
          echo "react-is resolved: $(grep -oE 'react-is@[0-9]+\.[0-9]+\.[0-9]+' pnpm-lock.yaml | sort -u | tr '\n' ' ')"
          if [ "$MAJORS" -gt 1 ]; then
            echo "✖ react-is resolves to $MAJORS different majors — align via pnpm override (#1697)."
            exit 1
          fi
          echo "✓ react-is resolved to a single major"
      - name: Dependency license gate (#271)
        run: node scripts/license-audit.mjs
      - name: Secrets hygiene gate (#126)
        run: node scripts/secret-scan.mjs
      - name: Child-safety content gate (#91)
        run: node scripts/content-safety.mjs
      - name: No-ads tracker gate (#92)
        run: node scripts/tracker-scan.mjs

  python-audit:
    name: python-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv (pinned for lockfile-toolchain reproducibility)
        run: python3 -m pip install --quiet "uv==0.11.3"
      # #1691 — Python backend deps get a vulnerability scan (mirror of the npm
      # dep-audit gate #308). `uv lock --check` guards against lockfile drift
      # (#1692) and `pip-audit` fails on any known vulnerability in the locked
      # non-dev requirement set. A seeded vulnerable pin (e.g. requests<2.32)
      # fails this gate.
      - name: Python dependency vulnerability audit (#1691/#1692)
        working-directory: apps/api
        run: |
          uv lock --check
          # --python 3.12: the locked requirement set is bounded to <3.14, so
          # pip-audit's collection must run on a supported interpreter (uvx
          # would otherwise pick an arbitrary uv-managed Python).
          uvx --python 3.12 pip-audit -r <(uv export --frozen --no-dev) --strict

  bundle-size:
    name: bundle-size
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # #891 — cache the pnpm content-addressable store keyed on the lockfile
      # hash (prefix fallback restores the previous store on a bump, so only
      # changed packages re-download) instead of letting a lockfile change
      # invalidate the whole install in lockstep.
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: core-dist
          path: packages/core/dist
      - name: Build kid app
        run: pnpm --filter kid build
      - name: Kid bundle blue-screen guard against the built bundle (#889)
        run: node scripts/kid-bundle-eval.mjs
      - name: Kid wire-budget gate (#886)
        run: node scripts/team/budget.mjs --skip-build
      - name: Bundle-size regression gate (#305)
        run: node scripts/bundle-size.mjs

  offline-e2e:
    name: e2e
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # #891 — cache the pnpm content-addressable store keyed on the lockfile
      # hash (prefix fallback restores the previous store on a bump, so only
      # changed packages re-download) instead of letting a lockfile change
      # invalidate the whole install in lockstep.
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: core-dist
          path: packages/core/dist
      - name: Install Playwright browsers (chromium + firefox + webkit)
        run: pnpm exec playwright install --with-deps
      # The e2e suite now ALSO runs against the PR's OWN bundles (via the
      # scripts/e2e-preview.mjs single-origin proxy). Building the parent with
      # NEXT_PUBLIC_BASE_PATH=/parent reproduces the production export layout
      # (nginx serves apps/parent/out under /parent/), and VITE/NEXT_PUBLIC_API_URL
      # keep the apps on the same-origin /api/v1 like the deployed build.
      - name: Build PR bundles (kid + parent) for local-preview e2e
        run: |
          pnpm --filter kid build
          NEXT_PUBLIC_BASE_PATH=/parent pnpm --filter parent build
        env:
          VITE_API_URL: /api/v1
          NEXT_PUBLIC_API_URL: /api/v1
      - name: Numberverse e2e — PR's own bundles (local preview, #264/#925/#926/#927)
        env:
          NV_E2E_BASE: http://127.0.0.1:8081
          NV_E2E_SKIP_VERSION_CHECK: "1"
        run: |
          # Preview server in the background; the env above reaches BOTH the
          # proxy script and the Playwright run. The trap kills the preview
          # when the step exits (success or failure) so no orphan lingers.
          node scripts/e2e-preview.mjs > /tmp/nv-e2e-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          pnpm exec playwright test
      # The live-targeted run stays as the shipped-artifact gate (#930): it
      # guards the deployed version and fails PRs whose stamp differs from live.
      # The local-preview step above is what exercises the PR's own bundles.
      - name: Numberverse e2e (#264 offline, #925 sync drain, #926 cross-app, #927 portal)
        run: pnpm exec playwright test

  oracle:
    name: oracle
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # #891 — pnpm content-addressable store cache (lockfile-keyed primary,
      # prefix-restore fallback so a lockfile bump only re-downloads the delta).
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: core-dist
          path: packages/core/dist
      - name: Oracle standup gate (#120)
        run: python3 scripts/team/oracle_team.py --ci --no-page --silent
