name: Auto-assign issues

"on":
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    steps:
      - name: Assign new issue to the maintainer
        uses: actions/github-script@v7
        with:
          script: |
            // Every new issue lands on the maintainer's plate automatically.
            const assignee = "bdlogicalerror"; // repo maintainer (owner of the org)
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: [assignee],
            });
