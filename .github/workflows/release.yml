name: Release

# Cut by the pipeline (infra/deploy/scripts/release.sh): pushing a semver
# tag (e.g. 0.24.1) triggers CI + this job → GitHub Release with notes.
# "v*" kept for any legacy vN tags still floating around.
"on":
  push:
    tags: ["0.*", "v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Changelog from commits since last tag
        id: changelog
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const { data: tags } = await github.rest.repos.listTags({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const idx = tags.map(t => t.name).indexOf(tag);
            const base = (idx >= 0 && idx < tags.length - 1) ? tags[idx + 1].name : null;
            let commits;
            if (base) {
              const { data } = await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: base,
                head: tag,
              });
              commits = data.commits;
            } else {
              const { data } = await github.rest.repos.listCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 60,
              });
              commits = data;
            }
            return (commits || [])
              .map(c => `- ${c.commit.message.split("\n")[0]}`)
              .join("\n");

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## What shipped
            ${{ steps.changelog.outputs.result }}

            > Full auto-generated notes from merged PRs below.
