[project]
name = "numberverse-api"
version = "0.1.0"
description = "Numberverse backend — JWT auth, kids, progress, content, admin"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "pyjwt>=2.9",
  "bcrypt>=4.1",
  "python-multipart>=0.0.9",
  "email-validator>=2.2",
  "google-auth>=2.29",
  "requests>=2.31",
  # #329 Kotha embeddings — pgvector SQL types (lightweight; the server-side
  # `vector` extension is ensured at job time). The actual embedding model is
  # an OPTIONAL extra so the API stays light: `pip install "numberverse-api[embeddings]"`.
  "pgvector>=0.3",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]

[tool.uv]
package = false
