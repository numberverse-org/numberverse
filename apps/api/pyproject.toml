[project]
name = "numberverse-api"
version = "0.1.0"
description = "Numberverse backend — JWT auth, kids, progress, content, admin"
# #1702 — requires-python is bounded to the tested interpreter range. CI runs a
# 3.12 + 3.13 matrix; 3.14 is not yet supported (would need a new lock + pass).
requires-python = ">=3.12,<3.14"
dependencies = [
  # #1693 — the manifest is the security contract: every dependency has an
  # explicit compatible upper bound so a bare `>=` can never silently float a
  # package into a range with known vulnerabilities (e.g. requests 2.31.x,
  # CVE-2024-35195). uv.lock/Dependabot keep the exact pins fresh.
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.4,<3.0",
  "pydantic>=2.13,<3.0",
  "starlette>=0.40,<2.0",
  "pyjwt>=2.9,<3.0",
  "bcrypt~=5.0",
  "python-multipart>=0.0.9,<1.0",
  "email-validator>=2.2,<3.0",
  "google-auth>=2.29,<3.0",
  "requests~=2.34",
  # bKash Tokenized Checkout routes outbound calls through the bkash-tunnel
  # container (socks5h:// proxy). requests needs PySocks for SOCKS proxies —
  # without it the first real bKash call raises "Missing dependencies for SOCKS
  # support". Present in the manifest, never forgeable (no default creds).
  "pysocks>=1.7.1,<2.0",
  # #329 Kotha embeddings — pgvector SQL types (lightweight; the server-side
  # `vector` extension is ensured at job time). The actual embedding model is
  # an OPTIONAL extra so the API stays light: `pip install "numberverse-api[embeddings]"`.
  "pgvector>=0.3,<1.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]

[tool.uv]
package = false
