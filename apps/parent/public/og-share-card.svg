<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="cardTitle cardDesc">
  <title id="cardTitle">This week in Numberverse</title>
  <desc id="cardDesc">Numberverse — a week of learning</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c4cf1"/>
      <stop offset="55%" stop-color="#5739d6"/>
      <stop offset="100%" stop-color="#3d2a9e"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- soft decorative orbs -->
  <circle cx="1060" cy="110" r="230" fill="rgba(255,255,255,0.07)"/>
  <circle cx="90" cy="560" r="260" fill="rgba(255,255,255,0.06)"/>
  <circle cx="930" cy="540" r="150" fill="rgba(255,255,255,0.05)"/>

  <!-- frosted inner card -->
  <rect x="90" y="70" width="1020" height="490" rx="36" fill="url(#cardFill)" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>

  <!-- big logo emoji -->
  <text x="600" y="310" text-anchor="middle" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif" font-size="150">🔢</text>

  <!-- app name -->
  <text x="600" y="415" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="1">Numberverse</text>

  <!-- tagline -->
  <text x="600" y="475" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" fill="rgba(255,255,255,0.88)">A week of learning</text>

  <!-- footer -->
  <text x="600" y="530" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" fill="rgba(255,255,255,0.7)">Made with 💜 by Numberverse · kids.munna-khan.xyz</text>
</svg>
