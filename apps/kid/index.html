<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0" />
    <!-- PWA manifest (generated: name/icons/theme) + favicon -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#0b2545" />
    <!-- #349 first-paint priority: preload the two fonts the FIRST screen uses
         (title face + body face). With font-display:swap this shrinks the
         system-font→custom-font swap to a single fast same-origin fetch, so
         first paint lands on the real look (no FOUC). Same-origin = zero
         cross-origin requests by design (offline-first), so <preconnect> is a
         deliberate no-op here — there's nothing external to warm up. -->
    <link rel="preload" href="/fonts/Baloo2-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Nunito-400.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS home-screen (Safari ignores the manifest; these drive it) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Numberverse" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iOS PWA splash startup images (#347, #995) — one per device size, portrait
         (the app is portrait-locked). Solid #0b2545 + centered owl. #995 added
         the missing common iPhone/iPad DPRs (SE/5, 12/13 mini, XS Max/11 Pro Max,
         iPad Air 4/5 + 10, iPad mini 6, iPad Pro 10.5, iPhone 16 Pro Max).
         Older iOS ignores these and auto-generates a splash from the
         apple-touch-icon + theme color, so nothing breaks on unsupported devices. -->
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
	    <!-- #995 — iPhone 16 Pro Max (440x956 @3x) -->
	    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1080x2340.png" media="(device-width: 360px) and (device-height: 780px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-640x1136.png" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1242x2208.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1536x2048.png" media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1668x2224.png" media="(device-width: 834px) and (device-height: 1112px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1620x2160.png" media="(device-width: 810px) and (device-height: 1080px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1668x2388.png" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1640x2360.png" media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1488x2266.png" media="(device-width: 744px) and (device-height: 1133px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-2048x2732.png" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2)" />
    <title>Numberverse — kids learn math &amp; Bangla, offline &amp; no ads</title>

    <!-- ── Social sharing preview (WhatsApp / Facebook / Twitter / LinkedIn) ──
         The app is a PWA; the stable home is https://kids.munna-khan.xyz. These
         tags make any shared link render a proper card. og:image is the static
         1200×630 card in public/ (served at /og-card.png). -->
    <meta name="description" content="Numberverse — the fun offline learning world for ages 2–13. Kids learn math & Bangla, no ads, no tracking. বাংলা শেখার অ্যাপ · অফলাইনেও চলে · কোনো বিজ্ঞাপন নেই" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Numberverse" />
    <meta property="og:url" content="https://kids.munna-khan.xyz/" />
    <meta property="og:title" content="Numberverse — kids learn math &amp; Bangla, offline &amp; no ads" />
    <meta property="og:description" content="The fun offline learning world for ages 2–13 — math & Bangla, adaptive, private. বাংলা শেখার অ্যাপ · অফলাইনেও চলে · কোনো বিজ্ঞাপন নেই" />
    <!-- #993 — host-absolute URL by design (crawlers only). og-card.png is
	         excluded from the SW precache (globIgnores) so this card is NOT
	         available offline — it is crawl-only for Facebook/WhatsApp/Twitter
	         link previews and does NOT participate in the offline contract. -->
	    <meta property="og:image" content="https://kids.munna-khan.xyz/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Numberverse — kids learn math and Bangla, offline, no ads" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="bn_BD" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Numberverse — kids learn math &amp; Bangla, offline &amp; no ads" />
    <meta name="twitter:description" content="The fun offline learning world for ages 2–13 — math & Bangla, adaptive, private. বাংলা শেখার অ্যাপ · অফলাইনেও চলে · কোনো বিজ্ঞাপন নেই" />
    <meta name="twitter:image" content="https://kids.munna-khan.xyz/og-card.png" />
    <meta name="twitter:image:alt" content="Numberverse — kids learn math and Bangla, offline, no ads" />

    <!-- Canonical + structured data (honest: free PWA, no fake ratings) -->
    <link rel="canonical" href="https://kids.munna-khan.xyz/" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Numberverse",
      "url": "https://kids.munna-khan.xyz/",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Any (Web / PWA)",
      "description": "The fun offline learning world for ages 2–13 — kids learn math & Bangla, no ads, no tracking.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "inLanguage": ["en", "bn"]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
