<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0" />
    <script>
      // #1787 + #1789 — single operator-configurable sources for the production
      // origin and the brand's X/Twitter handle. Change THESE two constants and
      // the DOM-ready block below rewrites every origin/twitter-bearing tag so
      // the hardcoded copies can never drift. The static attribute values in
      // this file keep the same defaults so non-JS crawlers still read the
      // correct canonical/og/twitter/hreflang URLs.
      const SITE_URL = "https://kids.munna-khan.xyz";
      // #1789 — PLACEHOLDER brand handle: the operator must set the real
      // @handle here (there is no known brand handle in the repo yet).
      const BRAND_TWITTER = "@numberverse";

      document.addEventListener("DOMContentLoaded", function () {
        var origin = SITE_URL.replace(/\/+$/, "");
        function setContent(sel, val) {
          var el = document.querySelector(sel);
          if (el) el.setAttribute("content", val);
        }
        function setHref(sel, val) {
          var el = document.querySelector(sel);
          if (el) el.setAttribute("href", val);
        }
        setContent('meta[property="og:url"]', origin + "/");
        setContent('meta[property="og:image"]', origin + "/og-card.png");
        setContent('meta[name="twitter:image"]', origin + "/og-card.png");
        setContent('meta[name="twitter:site"]', BRAND_TWITTER);
        setContent('meta[name="twitter:creator"]', BRAND_TWITTER);
        setHref('link[rel="canonical"]', origin + "/");
        // #1790 — self-referencing hreflang alternates (same canonical URL:
        // the PWA localizes in-app, there is no separate bn URL).
        setHref('link[rel="alternate"][hreflang="en"]', origin + "/");
        setHref('link[rel="alternate"][hreflang="bn"]', origin + "/");
        setHref('link[rel="alternate"][hreflang="x-default"]', origin + "/");
        // #1787 — the WebApplication JSON-LD url.
        var jsonLd = document.querySelector('script[type="application/ld+json"]');
        if (jsonLd) {
          try {
            var data = JSON.parse(jsonLd.textContent);
            data.url = origin + "/";
            jsonLd.textContent = JSON.stringify(data, null, 2);
          } catch (_) { /* never break the page over a meta rewrite */ }
        }
      });
    </script>
    <!-- PWA manifest (generated: name/icons/theme) + favicon.
         #1736 — the NEW favicon.svg + 32×32 PNG fallback (files owned by the
         sibling kid-assets task; this HTML only wires the links). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- #1736 — favicon.png IS the 32×32 fallback now (re-exported 32×32 by the
         kid-assets task; there is no separate favicon-32.png). -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <meta name="theme-color" content="#0b2545" />
    <!-- #349 first-paint priority: preload the faces the FIRST screen (splash)
         actually draws — Baloo 2 weight 800 (title) + 700 (tag). The old
         Baloo2-500 + Nunito-400 preloads warmed faces the splash never renders
         (#1715). Same-origin = zero cross-origin requests by design
         (offline-first), so <preconnect> is a deliberate no-op here — there's
         nothing external to warm up. -->
    <link rel="preload" href="/fonts/Baloo2-800.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Baloo2-700.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // #1716/#1720 — the splash also renders Bangla when the app language is
      // bn (tag = weight 700, no-ads pill = weight 800). Preload those Noto
      // Sans Bengali faces, and mark the document language so
      // :lang(bn)/html.lang-bn rules (the Bangla legibility scale) match from
      // first paint. Reads nv_lang directly — same guarded read as main.tsx
      // (storage denied → English defaults).
      (function () {
        var isBn = false;
        try {
          isBn = (localStorage.getItem("nv_lang") || "en") === "bn";
        } catch (e) { /* storage denied — English defaults */ }
        if (!isBn) return;
        document.documentElement.lang = "bn";
        document.documentElement.classList.add("lang-bn");
        ["/fonts/NotoSansBengali-700.woff2", "/fonts/NotoSansBengali-800.woff2"].forEach(function (href) {
          var l = document.createElement("link");
          l.rel = "preload";
          l.href = href;
          l.as = "font";
          l.type = "font/woff2";
          l.crossOrigin = "";
          document.head.appendChild(l);
        });
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS home-screen (Safari ignores the manifest; these drive it) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Numberverse" />

         iPad Air 4/5 + 10, iPad mini 6, iPad Pro 10.5, iPhone 16 Pro Max).

	    <!-- #995 — iPhone 16 Pro Max (440x956 @3x) -->

    <title>Numberverse — kids learn math &amp; Bangla, offline &amp; no ads</title>

    <!-- ── Social sharing preview (WhatsApp / Facebook / Twitter / LinkedIn) ──
         The app is a PWA; the production origin is kids.munna-khan.xyz. The
         SITE_URL constant at the top of <head> is the single source of truth
         for ALL origin-bearing attributes (og:url, og:image, twitter:image,
         canonical, JSON-LD, hreflang); the static values below are the crawl-
         safe default. Change SITE_URL only, and the inline script rewrites
         every tag at load. -->
    <meta name="description" content="Numberverse — the fun offline learning world for ages 2–13. Kids learn math & Bangla, no ads, no tracking. বাংলা শেখার অ্যাপ · অফলাইনেও চলে · কোনো বিজ্ঞাপন নেই" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Numberverse" />
    <meta property="og:url" content="https://kids.munna-khan.xyz/" />
    <meta property="og:title" content="Numberverse — kids learn math &amp; Bangla, offline &amp; no ads" />
    <meta property="og:description" content="The fun offline learning world for ages 2–13 — math & Bangla, adaptive, private. বাংলা শেখার অ্যাপ · অফলাইনেও চলে · কোনো বিজ্ঞাপন নেই" />
    <!-- #993/#1735 — host-absolute URL by design (crawlers read it; the PWA
         never rewrites it at runtime). og-card.png IS in the SW precache (the
         vite glob covers png), and the WebP/AVIF alternatives (#1727) are
         served by the runtime nv-og CacheFirst route — so a shared link opened
         offline still shows its card. PNG stays the og:image for max crawler
         compatibility; webp/avif are the modern-format alternatives. -->
    <meta property="og:image" content="https://kids.munna-khan.xyz/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Numberverse — kids learn math and Bangla, offline, no ads" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="bn_BD" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Numberverse — kids learn math &amp; Bangla, offline &amp; no ads" />
    <meta name="twitter:description" content="The fun offline learning world for ages 2–13 — math & Bangla, adaptive, private. বাংলা শেখার অ্যাপ · অফলাইনেও চলে · কোনো বিজ্ঞাপন নেই" />
    <meta name="twitter:image" content="https://kids.munna-khan.xyz/og-card.png" />
    <meta name="twitter:image:alt" content="Numberverse — kids learn math and Bangla, offline, no ads" />
    <!-- #1789 — brand attribution: twitter:site (the card's account) and
         twitter:creator (the author). Both are driven by the BRAND_TWITTER
         constant at the top of <head>; the value here is the crawl-safe
         placeholder the operator must replace with the real @handle. -->
    <meta name="twitter:site" content="@numberverse" />
    <meta name="twitter:creator" content="@numberverse" />

    <!-- Canonical + structured data (honest: free PWA, no fake ratings) -->
    <link rel="canonical" href="https://kids.munna-khan.xyz/" />
    <!-- #1790 — self-referencing hreflang alternates: the PWA localizes in-app
         (no separate bn URL), so all three point at the same canonical URL.
         Standards-valid for a multilingual single-URL document. -->
    <link rel="alternate" hreflang="en" href="https://kids.munna-khan.xyz/" />
    <link rel="alternate" hreflang="bn" href="https://kids.munna-khan.xyz/" />
    <link rel="alternate" hreflang="x-default" href="https://kids.munna-khan.xyz/" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Numberverse",
      "url": "https://kids.munna-khan.xyz/",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Any (Web / PWA)",
      "description": "The fun offline learning world for ages 2–13 — kids learn math & Bangla, no ads, no tracking.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "inLanguage": ["en", "bn"]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
