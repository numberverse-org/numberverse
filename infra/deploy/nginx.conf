server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 512;

  # #1772 — locked-down security headers on every auth-bearing SPA. These are
  # inherited by locations with NO add_header of their own; nested locations
  # that set Cache-Control REPLACE the enclosing level's add_headers, so they
  # repeat the same lines below. `script-src` needs 'wasm-unsafe-eval' for the
  # kid app's on-device ORT WASM voice runtime; `style-src 'unsafe-inline'` for
  # React/Next inline styles; `blob:`/`data:` for media/downloads.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
  add_header X-Content-Type-Options "nosniff";
  add_header Referrer-Policy "strict-origin-when-cross-origin";
  add_header X-Frame-Options "DENY";
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com https://*.googleapis.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self' https://*.googleapis.com https://accounts.google.com https://www.gstatic.com; worker-src 'self'; frame-src https://accounts.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'";

  # kid PWA at root — SPA fallback; never cache the service worker, and the
  # HTML shell is revalidated (not cached) so installed PWAs always detect the
  # newest build and jump to it (see the controllerchange reload in main.tsx).
  location / {
    try_files $uri $uri/ /index.html;
    location = /sw.js {
      add_header Cache-Control "no-store";
      # #1772 — a location with add_header REPLACES the server-level block, so
      # repeat the security headers alongside Cache-Control.
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
      add_header X-Content-Type-Options "nosniff";
      add_header Referrer-Policy "strict-origin-when-cross-origin";
      add_header X-Frame-Options "DENY";
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com https://*.googleapis.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self' https://*.googleapis.com https://accounts.google.com https://www.gstatic.com; worker-src 'self'; frame-src https://accounts.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'";
      try_files /sw.js =404;
    }
    location = /index.html {
      add_header Cache-Control "no-cache";
      # #1772 — repeat security headers (this location's add_header replaces the
      # server-level set). The kid PWA's ld+json script block is a non-executable
      # data type, so script-src 'self' is sufficient.
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
      add_header X-Content-Type-Options "nosniff";
      add_header Referrer-Policy "strict-origin-when-cross-origin";
      add_header X-Frame-Options "DENY";
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com https://*.googleapis.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self' https://*.googleapis.com https://accounts.google.com https://www.gstatic.com; worker-src 'self'; frame-src https://accounts.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'";
      try_files /index.html =404;
    }
  }

  # Parent portal (Next.js static export under /parent/) — the dashboard is the
  # landing page: /parent/ (or /parent, which redirects here) → dashboard,
  # /parent/login → the sign-in form. The kid PWA's service worker MUST NOT
  # swallow these (see navigateFallbackDenylist in apps/kid/vite.config.ts).
  location = /parent {
    # Preserve https through the Cloudflare tunnel — $scheme at the origin is
    # http, and an auth-bearing app must not bounce the browser to a plain-http
    # Location. `if` + `return` is the one safe use of `if` in nginx.
    if ($http_x_forwarded_proto = "https") {
      return 302 https://$host/parent/;
    }
    return 302 /parent/;
  }
  location = /admin {
    if ($http_x_forwarded_proto = "https") {
      return 302 https://$host/admin/;
    }
    return 302 /admin/;
  }

  # Parent portal (Next.js static export under /parent/) — installable PWA:
  # the service worker must NEVER be cached (or updates never land) and the
  # manifest is revalidated, while the HTML shell is served no-cache so an
  # installed portal always picks up the newest build. Next `output: export`
  # emits nested routes as .html files (parent/page.tsx → parent.html), so
  # try $uri.html too — otherwise /parent/parent silently falls through to the
  # login page and the dashboard is unreachable.
  location /parent/ {
    try_files $uri $uri.html $uri/ /parent/index.html;
    # #1782 — the minted share link is `${base}/share/?t=<token>` (trailing
    # slash). The static export only emits `share.html` (no `share/` dir), so
    # `$uri/` falls through to the dashboard and the OG card never renders.
    # Pin the trailing-slash form to the file — the `?t=` query is preserved
    # and the client component reads it from window.location.search.
    location = /parent/share/ {
      try_files /parent/share.html =404;
    }
    location = /parent/sw.js {
      add_header Cache-Control "no-store";
      # #1772 — repeat security headers (this location's add_header replaces the
      # server-level set).
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
      add_header X-Content-Type-Options "nosniff";
      add_header Referrer-Policy "strict-origin-when-cross-origin";
      add_header X-Frame-Options "DENY";
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com https://*.googleapis.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self' https://*.googleapis.com https://accounts.google.com https://www.gstatic.com; worker-src 'self'; frame-src https://accounts.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'";
      try_files /parent/sw.js =404;
    }
    location = /parent/manifest.webmanifest {
      add_header Cache-Control "no-cache";
      # #1772 — repeat security headers (this location's add_header replaces the
      # server-level set).
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
      add_header X-Content-Type-Options "nosniff";
      add_header Referrer-Policy "strict-origin-when-cross-origin";
      add_header X-Frame-Options "DENY";
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com https://*.googleapis.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self' https://*.googleapis.com https://accounts.google.com https://www.gstatic.com; worker-src 'self'; frame-src https://accounts.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'";
      try_files /parent/manifest.webmanifest =404;
    }
    location = /parent/index.html {
      add_header Cache-Control "no-cache";
      # #1772 — repeat security headers. The parent portal is a Next.js static
      # export and ships build-time INLINE bootstrap scripts (self.__next_f), so
      # its CSP must add 'unsafe-inline' to script-src — a per-build sha256 would
      # churn with every deploy and a nonce can't be injected into static HTML.
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
      add_header X-Content-Type-Options "nosniff";
      add_header Referrer-Policy "strict-origin-when-cross-origin";
      add_header X-Frame-Options "DENY";
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://*.googleapis.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self' https://*.googleapis.com https://accounts.google.com https://www.gstatic.com; worker-src 'self'; frame-src https://accounts.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'";
      try_files /parent/index.html =404;
    }
  }

  # Admin console (react-admin SPA under /admin/)
  location /admin/ {
    try_files $uri $uri/ /admin/index.html;
  }

  # On-device neural voice (Piper VITS) — immutable content baked into the
  # image at build time; the PWA downloads it once and the service worker
  # runtime-caches it for offline use. gzip_static serves the build-time
  # <file>.gz (Dockerfile.web voice stage) — ~30% fewer wire bytes on the
  # first run — and Cloudflare's edge caches the compressed bytes close to BD.
  location /voice/ {
    # Explicit types — the ORT 1.27 loader does `import()` of the
    # ort-wasm-simd-threaded.mjs wrapper, and browsers REJECT ES modules served
    # as application/octet-stream (default for unknown .mjs) → the session
    # build stalls forever (the app's download bar parks at 99%). A `types`
    # block in a location REPLACES the inherited map, so list everything /voice/
    # serves. .wasm stays application/wasm for instantiateStreaming.
    types {
      text/javascript mjs;
      application/javascript js;
      application/wasm wasm;
      application/json json;
      application/octet-stream data onnx;
    }
    gzip_static on;
    gzip_vary on;
    add_header Cache-Control "public, max-age=31536000, immutable";
    # #1772 — /voice/ has its own add_header, so repeat the security headers
    # (a location's add_header replaces the server-level set).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header X-Frame-Options "DENY";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com https://*.googleapis.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self' https://*.googleapis.com https://accounts.google.com https://www.gstatic.com; worker-src 'self'; frame-src https://accounts.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'";
    try_files $uri =404;
  }

  # FastAPI
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # #1760 — REPLACE (not append) the XFF header with the real socket peer.
    # $proxy_add_x_forwarded_for appends $remote_addr to whatever the client
    # sent, and uvicorn's --forwarded-allow-ips took the LEFTMOST value — so a
    # client could rotate the header and mint a fresh rate-limit bucket. $remote_addr
    # is the actual peer nginx saw; the client can no longer inject a leftmost hop.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
  }
  location = /health {
    proxy_pass http://api:8000/health;
    # #1760 — same trusted-proxy contract as /api/ (health is behind the same nginx).
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
