server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 512;

  # kid PWA at root — SPA fallback; never cache the service worker, and the
  # HTML shell is revalidated (not cached) so installed PWAs always detect the
  # newest build and jump to it (see the controllerchange reload in main.tsx).
  location / {
    try_files $uri $uri/ /index.html;
    location = /sw.js {
      add_header Cache-Control "no-store";
      try_files /sw.js =404;
    }
    location = /index.html {
      add_header Cache-Control "no-cache";
      try_files /index.html =404;
    }
  }

  # Parent portal (Next.js static export under /parent/) — installable PWA:
  # the service worker must NEVER be cached (or updates never land) and the
  # manifest is revalidated, while the HTML shell is served no-cache so an
  # installed portal always picks up the newest build.
  location /parent/ {
    try_files $uri $uri/ /parent/index.html;
    location = /parent/sw.js {
      add_header Cache-Control "no-store";
      try_files /parent/sw.js =404;
    }
    location = /parent/manifest.webmanifest {
      add_header Cache-Control "no-cache";
      try_files /parent/manifest.webmanifest =404;
    }
    location = /parent/index.html {
      add_header Cache-Control "no-cache";
      try_files /parent/index.html =404;
    }
  }

  # Admin console (react-admin SPA under /admin/)
  location /admin/ {
    try_files $uri $uri/ /admin/index.html;
  }

  # On-device neural voice (Piper VITS) — immutable content baked into the
  # image at build time; the PWA downloads it once and the service worker
  # runtime-caches it for offline use. gzip_static serves the build-time
  # <file>.gz (Dockerfile.web voice stage) — ~30% fewer wire bytes on the
  # first run — and Cloudflare's edge caches the compressed bytes close to BD.
  location /voice/ {
    gzip_static on;
    gzip_vary on;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # FastAPI
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
  }
  location = /health { proxy_pass http://api:8000/health; }
}
