packages:
  - "apps/*"
  - "packages/*"

# pnpm 11: the canonical allow-list for packages with build scripts.
# esbuild's postinstall is REQUIRED for vite to work; sharp (transitive via
# vite-plugin-pwa image tooling) needs its postinstall too.
allowBuilds:
  esbuild: true
  sharp: true

onlyBuiltDependencies:
  - esbuild
  - sharp

# #586 — force patched nanoid (≥3.3.18) for GHSA-2v37-7h3g-55p8
# (transitive via postcss from next/vite; 3.3.17 is in the vulnerable range).
overrides:
  nanoid: ^3.3.18
